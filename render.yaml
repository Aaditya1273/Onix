services:
  - type: web
    name: vigil-server
    env: docker
    # One container: FalkorDB 6.0.2 on loopback, the demo graph, vigil-server,
    # and one run of the demo sessions so the dashboard opens on real decisions.
    dockerfilePath: ./deploy/full/Dockerfile
    dockerContext: .
    region: oregon
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: PORT # vigil-server listens on 8080
        value: "8080"
      # Every mutating route (the hook, agent actions, ask, ledger export, MCP
      # control) needs this bearer token; the dashboard's reads do not.
      - key: VIGIL_CONTROL_TOKEN
        generateValue: true
      # ── Required ──────────────────────────────────────────────────────────────
      # The public URL Render assigns to this service (fill after first deploy)
      # e.g. https://vigil-server.onrender.com
      - key: VIGIL_PUBLIC_BASE
        sync: false

      # URL of your deployed Vercel frontend (fill after Vercel deploy)
      # e.g. https://vigil.vercel.app
      - key: VIGIL_DASHBOARD_BASE
        sync: false

      # ── AI Inference (Featherless — optional; deterministic-only without it) ──
      - key: VIGIL_FEATHERLESS_API_KEY
        sync: false

      # ── Model identifiers (required if the key above is set) ──────────────────
      # Recommended: moonshotai/Kimi-K3 (fast, reasoner), zai-org/GLM-5.2 (reviewer)
      - key: VIGIL_FEATHERLESS_MODEL_FAST
        sync: false
      - key: VIGIL_FEATHERLESS_MODEL_REASONER
        sync: false
      - key: VIGIL_FEATHERLESS_MODEL_REVIEWER
        sync: false

      # ── Observability (optional — backend runs without these) ─────────────────
      - key: OTEL_EXPORTER_OTLP_ENDPOINT
        sync: false
      - key: OTEL_EXPORTER_OTLP_HEADERS
        sync: false

      # ── Budget & safety ───────────────────────────────────────────────────────
      # ── NVIDIA NIM inference ──────────────────────────────────────────────────
      - key: VIGIL_NVIDIA_API_KEY
        sync: false
      - key: VIGIL_NVIDIA_MODEL_FAST
        value: "meta/llama-3.1-8b-instruct"
      - key: VIGIL_NVIDIA_MODEL_REASONER
        value: "nvidia/llama-3.3-nemotron-super-49b-v1"
      - key: VIGIL_NVIDIA_MODEL_REVIEWER
        value: "nvidia/nemotron-3-ultra-550b-a55b"

      # ── Gemini (fallback) ─────────────────────────────────────────────────────
      - key: VIGIL_GEMINI_API_KEY
        sync: false
      - key: VIGIL_GEMINI_MODEL_FAST
        value: "gemini-3.5-flash-lite"
      - key: VIGIL_GEMINI_MODEL_REASONER
        value: "gemini-3.5-flash-lite"
      - key: VIGIL_GEMINI_MODEL_REVIEWER
        value: "gemini-3.5-flash-lite"

      # ── FalkorDB (graph memory) ───────────────────────────────────────────────
      # The image runs its own FalkorDB on loopback (VIGIL_FALKORDB_URL is set
      # in the image). It has no volume on the free plan: the graph is rebuilt
      # from the seed and the demo sessions on every start.
      - key: VIGIL_TRUST_THRESHOLD
        value: "20"

      # ── Budget & safety ───────────────────────────────────────────────────────
      - key: VIGIL_BUDGET_LIMIT
        value: "100"
      - key: VIGIL_ALLOW_EXEC
        value: "false"

      # ── Audit log ────────────────────────────────────────────────────────────
      - key: VIGIL_AUDIT_PATH
        value: "./vigil-audit.jsonl"

  # The website: landing page, dashboard (with the playground), Connect and docs.
  - type: web
    name: vigil-web
    runtime: node
    rootDir: frontend
    region: oregon
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: VIGIL_BACKEND_URL
        value: https://vigil-server.onrender.com
      - key: NEXT_PUBLIC_VIGIL_BACKEND_URL
        value: https://vigil-server.onrender.com
      - key: NEXT_PUBLIC_VIGIL_WS_URL
        value: wss://vigil-server.onrender.com/api/v1/vigil/ws
      - key: NEXT_PUBLIC_PLAYGROUND_URL
        value: https://vigil-playground.onrender.com
      - key: AUTH_SECRET
        generateValue: true
